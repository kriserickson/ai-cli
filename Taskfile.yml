version: "3"

vars:
  APP_NAME: ai
  DIST_DIR: dist/{{OS}}
  BIN_NAME: ai
  BIN_PATH: "{{.DIST_DIR}}/{{.BIN_NAME}}"
  INSTALL_DIR: '{{if eq OS "windows"}}{{.USERPROFILE}}\go\bin{{else}}/usr/local/bin{{end}}'
  INSTALL_PATH: '{{if eq OS "windows"}}{{.INSTALL_DIR}}\ai.exe{{else}}{{.INSTALL_DIR}}/ai{{end}}' 

tasks:
  default:
    desc: Build and test the project
    cmds:
      - task: build
      - task: test

  build:
    desc: Build the CLI binary to dist/<os>/
    cmds:
      - '{{if eq OS "windows"}}cmd /C "powershell -NoProfile -Command \"if (Test-Path ''{{.BIN_PATH}}'') { $bin=(Get-Item ''{{.BIN_PATH}}'').LastWriteTime; $srcs = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -eq ''.go'' -or $_.Name -eq ''go.mod'' -or $_.Name -eq ''go.sum'' }; if (-not ($srcs | Where-Object { $_.LastWriteTime -gt $bin })) { Write-Output ''Up-to-date: {{.BIN_PATH}}''; exit 0 } }; if (-not (Test-Path ''{{.DIST_DIR}}'')) { New-Item -ItemType Directory -Path ''{{.DIST_DIR}}'' | Out-Null }; & go build -o ''{{.BIN_PATH}}'' . ; Write-Output ''Built {{.BIN_PATH}}''\""{{else}}if [ -f "{{.BIN_PATH}}" ] && ! find . \( -name "*.go" -o -name "go.mod" -o -name "go.sum" \) -newer "{{.BIN_PATH}}" | grep -q . ; then echo "Up-to-date: {{.BIN_PATH}}" ; else mkdir -p "{{.DIST_DIR}}" && go build -o "{{.BIN_PATH}}" . && echo Built "{{.BIN_PATH}}" ; fi{{end}}'

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all Go tests with verbose output
    cmds:
      - go test ./... -v

  test:pkg:
    desc: Run tests for a specific package (set PKG=./internal/llm/...)
    vars:
      PKG: '{{default "./..." .PKG}}'
    cmds:
      - go test {{.PKG}}

  install:
    desc: Copy the built CLI into an OS-specific PATH directory
    deps:
      - build
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "if (-not (Test-Path -Path ''{{.INSTALL_DIR}}'')) { New-Item -ItemType Directory -Path ''{{.INSTALL_DIR}}'' | Out-Null }"{{else}}mkdir -p "{{.INSTALL_DIR}}" 2>/dev/null || (echo "Permission denied. Try running with sudo: sudo task install" && exit 1){{end}}' 
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "if (-not (Test-Path ''{{.DIST_DIR}}/ai'') -and -not (Test-Path ''{{.DIST_DIR}}/ai.exe'')) { Write-Error ''No built binary found in {{.DIST_DIR}}''; exit 1 }"{{else}}[ -f "{{.BIN_PATH}}" ] || (echo "No built binary found in {{.DIST_DIR}} — run: task build" && exit 1){{end}}' 
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "if (Test-Path ''{{.DIST_DIR}}/ai.exe'') { Copy-Item -Path ''{{.DIST_DIR}}/ai.exe'' -Destination ''{{.INSTALL_PATH}}'' -Force } else { Copy-Item -Path ''{{.DIST_DIR}}/ai'' -Destination ''{{.INSTALL_PATH}}'' -Force }"{{else}}cp "{{.BIN_PATH}}" "{{.INSTALL_PATH}}" 2>/dev/null || (echo "Permission denied. Try running with sudo: sudo task install" && exit 1) && chmod +x "{{.INSTALL_PATH}}"{{end}}' 
      - echo Installed "{{.APP_NAME}}" to "{{.INSTALL_PATH}}"
      - cmd: 'echo "Ensure {{.INSTALL_DIR}} is in your PATH to use the {{.APP_NAME}} command."'
        ignore_error: true
