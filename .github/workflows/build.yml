name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  # Non-release builds: verify cross-compilation works
  build:
    name: Build (snapshot)
    runs-on: ubuntu-latest
    needs: test
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser build (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

  # Tag pushes: sign, notarize, release, publish Homebrew formula
  release:
    name: Release
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import Apple certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="$(mktemp /tmp/cert.XXXXXX.p12)"
          KEYCHAIN_FILE="$(mktemp /tmp/keychain.XXXXXX.keychain-db)"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "${CERTIFICATE_BASE64}" | base64 --decode > "${CERT_FILE}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FILE}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_FILE}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_FILE}"
          security import "${CERT_FILE}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_FILE}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_FILE}"
          security list-keychains -d user -s \
            "${KEYCHAIN_FILE}" \
            $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_FILE=${KEYCHAIN_FILE}" >> "${GITHUB_ENV}"
          rm -f "${CERT_FILE}"

      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize darwin binaries
        if: ${{ secrets.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh scripts/notarize-darwin.sh

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ] && [ -f "${KEYCHAIN_FILE}" ]; then
            security delete-keychain "${KEYCHAIN_FILE}" 2>/dev/null || true
          fi
