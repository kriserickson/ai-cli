name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    needs: test
    # Update your matrix in build.yml
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_ext: tar.gz
          - goos: darwin
            goarch: amd64 # Intel Macs
            artifact_ext: tar.gz
          - goos: darwin
            goarch: arm64 # Apple Silicon Macs
            artifact_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN_NAME=ai
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME=ai.exe
          fi
          go build -trimpath -ldflags="-s -w -X github.com/kriserickson/ai-cli/cmd.Version=${VERSION}" -o "dist/${BIN_NAME}" .

      - name: Package artifact (unix)
        if: matrix.goos != 'windows'
        run: |
          ARTIFACT="ai-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.artifact_ext }}"
          tar -C dist -czf "${ARTIFACT}" .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Package artifact (windows)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="ai-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.artifact_ext }}"
          cd dist
          zip -q "../${ARTIFACT}" ai.exe
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ai-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*
