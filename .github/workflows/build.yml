name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_ext: tar.gz
          - goos: darwin
            goarch: amd64
            artifact_ext: tar.gz
          - goos: windows
            goarch: amd64
            artifact_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN_NAME=ai
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME=ai.exe
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN_NAME}" .

      - name: Package artifact (unix)
        if: matrix.goos != 'windows'
        run: |
          ARTIFACT="ai-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.artifact_ext }}"
          tar -C dist -czf "${ARTIFACT}" .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Package artifact (windows)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="ai-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.artifact_ext }}"
          cd dist
          zip -q "../${ARTIFACT}" ai.exe
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
